# ضَع الملف ده في مشروعك على GitHub بالمسار:  .github/workflows/build.yml
#
# بيبني اللعبة نسختين EXE للكمبيوتر (ويندوز):
#   - WhisperingHouse-win64.exe  (64 بت)
#   - WhisperingHouse-win32.exe  (32 بت)
#
# بيشتغل لوحده عند كل push، أو يدوي من تبويب Actions (Run workflow).
# الملفات بتلاقيها في صفحة التشغيل تحت Artifacts.
# ولو عملت tag بالشكل v1.0 بيتعمل Release فيه الملفين جاهزين للتحميل.

name: Build Windows EXE (32 + 64 bit)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # عشان يعمل Release لما تحط tag

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            label: win64
          - arch: x86
            label: win32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'          # 3.11 ليها مكتبات جاهزة للـ 32 بت والـ 64 بت
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame arabic-reshaper python-bidi pyttsx3 pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          $opts = @(
            '--noconfirm', '--clean', '--onefile',
            '--windowed',                                  # شيل السطر ده لو عايز نافذة الكونسول تظهر (مفيدة لو فيه مشكلة)
            '--name', 'WhisperingHouse-${{ matrix.label }}',
            '--collect-submodules', 'pyttsx3'              # صوت نطق الأسماء
          )
          if (Test-Path 'assets')    { $opts += @('--add-data', 'assets;assets') }   # الصور والخط
          if (Test-Path 'server.py') { $opts += @('--hidden-import', 'server') }     # سيرفر الأونلاين
          if (Test-Path 'icon.ico')  { $opts += @('--icon', 'icon.ico') }            # أيقونة (اختياري)
          pyinstaller @opts main.py

      - name: Show result
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperingHouse-${{ matrix.label }}
          path: dist/WhisperingHouse-${{ matrix.label }}.exe

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WhisperingHouse-${{ matrix.label }}.exe
